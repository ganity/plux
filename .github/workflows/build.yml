name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test
        run: cargo test --locked --all-targets --target ${{ matrix.target }}
      - name: Build release
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: tar -C target/${{ matrix.target }}/release -czf plux-${{ matrix.target }}.tar.gz plux
      - uses: actions/upload-artifact@v4
        with:
          name: plux-${{ matrix.target }}
          path: plux-${{ matrix.target }}.tar.gz
          if-no-files-found: error
